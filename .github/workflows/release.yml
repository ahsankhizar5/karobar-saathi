name: Build release APK

on:
  push:
    tags:
      - 'v*'

env:
  API_BASE_URL: ${{ vars.API_BASE_URL }}

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: karobar_saathi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require API base URL
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "API_BASE_URL repository variable is not set. Set it under Settings > Secrets and variables > Variables."
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Get packages
        run: flutter pub get

      - name: Decode signing credentials
        if: env.KEYSTORE_BASE64 != '' && env.KEY_PROPERTIES != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/karobar-saathi-release.jks
          echo "$KEY_PROPERTIES" > android/key.properties

      - name: Build release APK
        run: flutter build apk --release --dart-define=API_BASE_URL=$API_BASE_URL

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: karobar_saathi/build/app/outputs/flutter-apk/app-release.apk

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.repository == 'ahsankhizar5/karobar-saathi' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: release-assets

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release-assets/app-release.apk --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Karobar Saathi ${GITHUB_REF_NAME}" \
              --notes "See [CHANGELOG.md](../blob/main/CHANGELOG.md) for details." \
              release-assets/app-release.apk
          fi
