name: karobar_saathi
description: Karobar Saathi — voice-first financial evidence for Pakistani micro-businesses.
publish_to: 'none'
version: 1.4.2+7

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.2.3
  http: ^1.2.1
  record: ^5.2.1
  permission_handler: ^11.3.1
  path_provider: ^2.1.3
  intl: ^0.19.0
  package_info_plus: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

dependency_overrides:
  # record 5.2.1 pins record_linux ^0.7.2, which is incompatible with the
  # record_platform_interface version resolved by newer pub solves. Override
  # to a Linux implementation that implements the current platform interface.
  record_linux: ^1.1.1

flutter:
  uses-material-design: true

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit.ttf
